site_name: OmniSignal
site_description: Unified signal ingestion abstraction for operational intelligence
site_url: https://plexusone.github.io/omnisignal
repo_url: https://github.com/plexusone/omnisignal
repo_name: plexusone/omnisignal

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Configuration: configuration.md
  - Providers:
      - Overview: providers/index.md
      - PagerDuty: providers/pagerduty.md
      - Jira: providers/jira.md
  - Extending: extending.md
  - API Reference: https://pkg.go.dev/github.com/plexusone/omnisignal

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/omnisignal
